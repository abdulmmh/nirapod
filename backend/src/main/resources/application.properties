spring.application.name=nirapod

# ── Database ───────────────────────────────────────────────────────────────
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nirapod_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# validate: startup fails if schema doesn't match entities — safe for production.
# Use 'update' only in local dev via application-local.properties override.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=false
# Never log SQL in production — leaks query structure and parameters.
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# ── JWT ────────────────────────────────────────────────────────────────────
# Must be at least 32 characters. Set via environment variable — never commit the real value.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── File Upload ────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
# External path outside the JAR — safe for production deployments.
# Override UPLOAD_DIR env var per environment.
# ── File Upload ────────────────────────────────────────────────────────────
app.upload.dir           = src/main/resources/static/uploads/profile-photos
ait.upload.dir           = src/main/resources/static/uploads/ait-documents
refund.upload.dir        = src/main/resources/static/uploads/refund-documents
appeal.upload.dir		 = src/main/resources/static/uploads/appeal-documents


# ── Email ──────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── NVTMS Email Display Name ───────────────────────────────────────────────
nvtms.mail.from-name=NVTMS \u2013 VAT & Tax Management

# ── Async Thread Pool (email sending) ─────────────────────────────────────
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=mail-

# ── Base URL ───────────────────────────────────────────────
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}



server.address=0.0.0.0
server.port=8080